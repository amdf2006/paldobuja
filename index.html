<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>팔도부자</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --felt:#1f5751; --felt2:#143c38;
  --board:#e9f1e6; --cell:#f7faf3; --line:#2a3b37;
  --ink:#1f2a28; --muted:#5d6d68;
  --gold:#f0b42a; --gold-ink:#3b2700; --red:#c8402f; --good:#2f9e61;
  --panel:#f7faf3; --modal:#ffffff; --shade:rgba(8,22,20,.6);
  --chip:#e3ebe0;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --felt:#123532; --felt2:#0a201e;
    --board:#1d2a27; --cell:#24322e; --line:#90a9a1;
    --ink:#e7efe9; --muted:#a2b3ad;
    --panel:#1b2624; --modal:#22302c; --shade:rgba(0,0,0,.65);
    --chip:#2c3b37;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --felt:#123532; --felt2:#0a201e;
  --board:#1d2a27; --cell:#24322e; --line:#90a9a1;
  --ink:#e7efe9; --muted:#a2b3ad;
  --panel:#1b2624; --modal:#22302c; --shade:rgba(0,0,0,.65);
  --chip:#2c3b37;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:radial-gradient(circle at 45% 35%,var(--felt),var(--felt2));
  font-family:'Gowun Dodum',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:var(--ink)}
button{font:inherit}
.jua{font-family:'Jua','Gowun Dodum',system-ui,sans-serif}

.app{display:grid;grid-template-columns:auto 270px;gap:14px;justify-content:center;align-items:start;padding:12px}
.board-wrap{width:min(calc(100vw - 306px),calc(100vh - 24px),980px);min-width:320px}
@media (max-width:900px){
  .app{grid-template-columns:1fr;padding:8px}
  .board-wrap{width:calc(100vw - 16px);min-width:0}
}

.board{position:relative;aspect-ratio:1/1;display:grid;
  grid-template-columns:1.6fr repeat(11,1fr) 1.6fr;grid-template-rows:1.6fr repeat(11,1fr) 1.6fr;
  background:var(--board);border:3px solid var(--line);border-radius:12px;container-type:inline-size;
  box-shadow:0 18px 40px rgba(0,0,0,.35);overflow:hidden}
.cell{position:relative;border:1px solid color-mix(in srgb,var(--line) 40%,transparent);background:var(--cell);
  display:flex;overflow:hidden;cursor:pointer;min-width:0;min-height:0;padding:0;color:inherit;text-align:center}
.cell:focus-visible{outline:3px solid var(--gold);outline-offset:-3px;z-index:3}
.cell .band{flex:0 0 22%}
.cell.b{flex-direction:column}.cell.t{flex-direction:column-reverse}
.cell.l{flex-direction:row-reverse}.cell.r{flex-direction:row}
.cell .body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1px;gap:.25cqw;min-width:0;min-height:0}
.board{--fs:1}
.board.fs2{--fs:1.18}.board.fs3{--fs:1.38}
.cell .ico{font-size:calc(var(--fs)*max(8px,1.45cqw));line-height:1}
.cell .nm{font-family:'Jua',sans-serif;font-size:calc(var(--fs)*max(9px,1.62cqw));line-height:1.05;word-break:keep-all;overflow-wrap:anywhere}
.cell .pr{font-size:calc(var(--fs)*max(8px,1.22cqw));color:var(--muted);line-height:1;font-weight:700}
.board.fs3 .cell:not(.corner) .ico{display:none}
.cell.corner .ico{font-size:max(12px,3.3cqw)}
.cell.corner .nm{font-size:calc(var(--fs)*max(9px,1.6cqw))}
.cell.corner .pr{font-size:calc(var(--fs)*max(8px,1.2cqw))}
.cell.owned{box-shadow:inset 0 0 0 max(2px,.42cqw) var(--oc)}
.cell .own{position:absolute;left:0;right:0;bottom:1px;font-size:max(6px,1.05cqw);line-height:1;pointer-events:none}
.cell.t .own{bottom:auto;top:1px}
.cell.mort .body{opacity:.4}
.cell.mort::after{content:'저당';position:absolute;inset:auto 0 30% 0;font-family:'Jua';font-size:max(6px,1.05cqw);color:var(--red)}
.cell.here{background:color-mix(in srgb,var(--gold) 22%,var(--cell))}

.center{grid-area:2/2/13/13;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4cqw;padding:2cqw;
  background:
    radial-gradient(circle at 50% 46%,color-mix(in srgb,var(--gold) 16%,transparent) 0 28%,transparent 29%),
    var(--board)}
.brand{text-align:center;line-height:1}
.brand h1{margin:0;font-family:'Jua';font-size:max(22px,7.4cqw);letter-spacing:.02em;color:var(--ink);
  text-shadow:.35cqw .35cqw 0 color-mix(in srgb,var(--gold) 75%,transparent)}
.meta{margin-top:.8cqw;font-size:max(10px,1.45cqw);color:var(--muted);display:flex;gap:1.6cqw;justify-content:center;flex-wrap:wrap}
.host{display:flex;align-items:flex-end;gap:1.2cqw;max-width:88%}
.toad{width:max(54px,11cqw);flex:0 0 auto}
.toad svg{width:100%;display:block}
.bubble{position:relative;background:var(--modal);color:var(--ink);border:2px solid var(--line);border-radius:16px;
  padding:1.1cqw 1.6cqw;font-size:max(11px,1.75cqw);line-height:1.4;min-height:3em;display:flex;align-items:center;word-break:keep-all}
.bubble::before{content:'';position:absolute;left:-10px;bottom:14px;border:8px solid transparent;border-right-color:var(--line);border-left:0}
.bubble.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.92);opacity:.4}100%{transform:scale(1);opacity:1}}
.turnline{font-family:'Jua';font-size:max(12px,2cqw);display:flex;align-items:center;gap:.8cqw}
.turnline .mini{width:max(20px,3.4cqw);height:max(20px,3.4cqw)}
.dice{display:flex;gap:1.4cqw;cursor:pointer;border-radius:12px;padding:.4cqw}
.dice.spin{outline:3px dashed var(--gold);outline-offset:3px}
.die.stopped{transform:scale(1.08)}
.die{width:max(30px,5.6cqw);height:max(30px,5.6cqw);background:#fff;border:2px solid #2a3b37;border-radius:22%;
  display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:12%;box-shadow:0 3px 0 #2a3b37}
.die i{border-radius:50%;margin:12%}
.die i.on{background:#c8402f}
.die.roll{animation:roll .5s ease}
@keyframes roll{0%{transform:rotate(0) scale(1)}50%{transform:rotate(200deg) scale(1.15)}100%{transform:rotate(360deg) scale(1)}}
.controls{display:flex;flex-wrap:wrap;gap:1cqw;justify-content:center;min-height:max(34px,5cqw)}
.thinking{font-size:max(11px,1.6cqw);color:var(--muted)}

.btn{font-family:'Jua';border:0;border-radius:12px;padding:.5em 1em;background:var(--gold);color:var(--gold-ink);cursor:pointer;
  font-size:max(13px,1.75cqw);box-shadow:0 3px 0 color-mix(in srgb,var(--gold) 55%,#000);line-height:1.2}
.btn:hover{filter:brightness(1.05)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 color-mix(in srgb,var(--gold) 55%,#000)}
.btn.sec{background:transparent;color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn.red{background:var(--red);color:#fff;box-shadow:0 3px 0 #7d2219}
.btn.small{font-size:13px;padding:.35em .7em}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn:focus-visible,.chipbtn:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

#pieces{position:absolute;inset:0;pointer-events:none;z-index:6}
.piece{position:absolute;width:var(--ps);height:var(--ps);transform:translate(-50%,-50%);transition:left .14s ease,top .14s ease}
.piece .art{width:100%;height:100%;filter:drop-shadow(0 2px 1.5px rgba(0,0,0,.4))}
.piece .art svg{width:100%;height:100%;display:block}
.piece .tag{position:absolute;bottom:92%;left:50%;transform:translateX(-50%);background:var(--pc);color:#fff;
  font-family:'Jua';font-size:var(--tf);padding:.1em .5em;border-radius:999px;white-space:nowrap;border:1.5px solid #fff;line-height:1.25}
.piece.cur{z-index:3}
.piece.cur .art{animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.12)}}
.piece.hop .art{animation:hop .16s ease}
@keyframes hop{50%{transform:translateY(-35%)}}
.float{position:absolute;font-family:'Jua';font-size:max(12px,1.8cqw);transform:translate(-50%,-50%);animation:floatup 1.3s ease forwards;white-space:nowrap;
  text-shadow:0 0 3px #fff,0 0 3px #fff}
.float.plus{color:var(--good)}.float.minus{color:var(--red)}
@keyframes floatup{0%{opacity:0;margin-top:0}15%{opacity:1}100%{opacity:0;margin-top:-3.5em}}

.side{display:flex;flex-direction:column;gap:10px;max-height:calc(100vh - 24px)}
@media (max-width:900px){.side{max-height:none}}
.panel{background:var(--panel);border-radius:14px;padding:12px;border:2px solid color-mix(in srgb,var(--line) 30%,transparent)}
.panel h2{font-family:'Jua';font-size:17px;margin:0 0 8px;font-weight:400}
.toprow{display:flex;gap:8px}
.toprow .btn{flex:1;font-size:14px}
.pcard{display:grid;grid-template-columns:40px 1fr;gap:8px;padding:8px;border-radius:12px;border:2px solid transparent;align-items:center}
.pcard+.pcard{margin-top:6px}
.pcard.cur{border-color:var(--pc);background:color-mix(in srgb,var(--pc) 10%,transparent)}
.pcard.out{opacity:.45;filter:grayscale(1)}
.pcard .pi{width:40px;height:40px}
.pcard .pn{font-family:'Jua';font-size:15px;display:flex;align-items:center;gap:6px}
.pcard .pn .dot{width:10px;height:10px;border-radius:50%;background:var(--pc)}
.pcard .tagcpu{font-size:11px;background:var(--chip);border-radius:6px;padding:0 5px;color:var(--muted)}
.pcard .pm{font-size:14px;font-weight:700}
.pcard .st{font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}
.chips span{width:12px;height:12px;border-radius:3px;display:inline-block}
.chips span.m{opacity:.35}
.log{overflow:auto;flex:1;min-height:120px;max-height:280px;font-size:13px;line-height:1.5}
.log p{margin:0 0 4px;padding-bottom:4px;border-bottom:1px dashed color-mix(in srgb,var(--line) 25%,transparent)}

.modal{position:fixed;inset:0;background:var(--shade);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:max(12px,3vh) 12px}
.modal.open{display:flex}
.sheet{background:var(--modal);color:var(--ink);border-radius:18px;max-width:480px;width:100%;max-height:94vh;max-height:calc(100dvh - 24px);overflow:auto;padding:0;
  box-shadow:0 20px 50px rgba(0,0,0,.4);animation:pop .25s ease}
.sheet .head{padding:16px 18px 12px;color:#fff;border-radius:18px 18px 0 0}
.sheet .head .grp{font-size:13px;opacity:.9}
.sheet .head h3{margin:2px 0 0;font-family:'Jua';font-size:24px;font-weight:400;display:flex;gap:8px;align-items:center}
.sheet .inner{padding:14px 18px 0}
.sheet .inner p{line-height:1.6;margin:0 0 10px}
.sheet h4{font-family:'Jua';font-weight:400;font-size:16px;margin:14px 0 4px}
.sheet .actions{display:flex;flex-wrap:wrap;gap:8px;padding:12px 18px 16px;margin-top:8px;position:sticky;bottom:0;background:var(--modal);box-shadow:0 -8px 10px -9px rgba(0,0,0,.35)}
.sheet .actions .btn{flex:1 1 auto;font-size:15px}
.rents{width:100%;border-collapse:collapse;font-size:14px}
.rents td{padding:4px 2px;border-bottom:1px dashed color-mix(in srgb,var(--line) 25%,transparent)}
.rents td:last-child{text-align:right;font-weight:700}
.rents tr.now td{color:var(--red)}
.quiz-opts{display:grid;gap:8px;margin-top:8px}
.quiz-opts button{text-align:left;padding:10px 12px;border-radius:10px;border:2px solid color-mix(in srgb,var(--line) 40%,transparent);background:var(--cell);color:var(--ink);cursor:pointer;font-size:15px}
.quiz-opts button.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 18%,var(--cell))}
.quiz-opts button:disabled{cursor:default}
.quiz-opts button.wrong{border-color:var(--red);background:color-mix(in srgb,var(--red) 15%,var(--cell))}
.pricebig{font-family:'Jua';font-size:22px}
.pricebig s{color:var(--muted);font-size:16px;margin-right:6px}
.note{font-size:13px;color:var(--muted)}
.mrow{display:grid;grid-template-columns:12px 1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px dashed color-mix(in srgb,var(--line) 25%,transparent)}
.mrow .sw{width:12px;height:12px;border-radius:3px}
.mrow .mn{font-size:15px}
.mrow .mn small{display:block;color:var(--muted);font-size:12px}
.mrow .mb{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.cardface{margin:6px 18px 0;border-radius:14px;padding:22px 18px;text-align:center;font-family:'Jua';font-size:20px;line-height:1.45;border:3px dashed var(--line)}
.tplist{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-height:50vh;overflow:auto}
.tplist button{display:flex;gap:6px;align-items:center;text-align:left;padding:8px;border-radius:10px;border:2px solid color-mix(in srgb,var(--line) 30%,transparent);background:var(--cell);color:var(--ink);cursor:pointer;font-size:14px}
.tplist .sw{width:10px;height:10px;border-radius:2px;flex:0 0 auto}

.setup{position:fixed;inset:0;z-index:40;overflow:auto;display:flex;justify-content:center;align-items:flex-start;padding:24px 14px;
  background:radial-gradient(circle at 50% 20%,var(--felt),var(--felt2))}
.setup.hide{display:none}
.setup input.txt{width:100%;padding:10px 12px;border-radius:10px;border:2px solid color-mix(in srgb,var(--line) 40%,transparent);background:var(--cell);color:var(--ink);font-size:17px;font-family:inherit}
.tabs{display:flex;gap:6px;justify-content:center;margin:0 0 14px}
.tabs .chipbtn{font-size:16px;padding:.4em 1.1em}
.codebig{font-family:'Jua';font-size:46px;letter-spacing:.14em;text-align:center;margin:4px 0}
.joinrow{display:flex;gap:8px}
.joinrow input{text-transform:uppercase;letter-spacing:.1em}
.err{color:var(--red);font-size:14px;min-height:1.2em;margin:8px 0 0}
.lrow{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;padding:8px;border-radius:12px;background:var(--chip);margin-bottom:6px}
.lrow .pi{width:40px;height:40px}
.lrow .nm{font-family:'Jua';font-size:16px}
.opts .orow{display:grid;grid-template-columns:78px 1fr;gap:8px;align-items:center;margin:7px 0;font-size:14px}
.opts input[type=range]{width:100%;accent-color:var(--gold)}
.opts .chipbtn{font-size:13px;padding:.25em .7em}
.setup .card{background:var(--panel);border-radius:22px;max-width:620px;width:100%;padding:22px 20px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.setup .logo{display:flex;align-items:center;gap:14px;justify-content:center;margin-bottom:6px}
.setup .logo h1{font-family:'Jua';font-size:54px;margin:0;font-weight:400;text-shadow:3px 3px 0 color-mix(in srgb,var(--gold) 75%,transparent)}
.setup .logo .toad{width:80px}
.setup .sub{text-align:center;color:var(--muted);margin:0 0 18px}
.setup label.lbl{font-family:'Jua';font-size:16px;display:block;margin:14px 0 6px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.chipbtn{border:2px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:.35em .9em;cursor:pointer;font-family:'Jua';font-size:15px}
.chipbtn.on{background:var(--ink);color:var(--panel)}
.prow{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:center;padding:8px;border-radius:12px;background:var(--chip);margin-bottom:6px}
.prow .pi{width:44px;height:44px;cursor:pointer;border-radius:10px;border:2px solid var(--pc);background:var(--cell)}
.prow input{width:100%;padding:8px 10px;border-radius:10px;border:2px solid color-mix(in srgb,var(--line) 40%,transparent);background:var(--cell);color:var(--ink);font-size:16px;font-family:inherit}
.prow .who{display:flex;gap:4px}
.animals{display:flex;gap:4px;flex-wrap:wrap;grid-column:1/-1}
.animals button{width:40px;height:40px;border-radius:10px;border:2px solid transparent;background:var(--cell);cursor:pointer;padding:2px}
.animals button.on{border-color:var(--ink)}
.animals button:disabled{opacity:.25;cursor:not-allowed}
.startrow{display:flex;gap:8px;margin-top:20px}
.startrow .btn{flex:1;font-size:19px;padding:.6em}

@media (prefers-reduced-motion: reduce){
  .piece{transition:none}
  .piece.cur .art,.piece.hop .art,.die.roll,.bubble.pop,.sheet,.float{animation:none}
}
</style>
</head>
<body>

<div class="setup" id="setup"></div>

<div class="app" id="app">
  <div class="board-wrap">
    <div class="board" id="board">
      <div class="center" id="center">
        <div class="brand"><h1>팔도부자</h1><div class="meta" id="meta"></div></div>
        <div class="host"><div class="toad" id="toad"></div><div class="bubble" id="bubble" aria-live="polite">어서 오세요! 팔도부자 은행장 금두꺼비예요.</div></div>
        <div class="turnline" id="turnline"></div>
        <div class="dice" id="dice" title="주사위"><div class="die" id="d1"></div><div class="die" id="d2"></div></div>
        <div class="controls" id="controls"></div>
      </div>
      <div id="pieces"></div>
    </div>
  </div>
  <aside class="side">
    <div class="toprow">
      <button class="btn sec" id="btnRules">규칙 보기</button>
      <button class="btn sec" id="btnNew">새 게임</button>
    </div>
    <div class="panel opts"><h2>소리·화면</h2>
      <div class="orow"><label for="volBgm">🎵 배경음악</label><input type="range" id="volBgm" min="0" max="100"></div>
      <div class="orow"><label for="volSfx">🔔 효과음</label><input type="range" id="volSfx" min="0" max="100"></div>
      <div class="orow"><span>🗣️ 음성</span><div class="seg" id="segVoice"></div></div>
      <div class="orow"><span>🔠 글씨</span><div class="seg" id="segFs"></div></div>
      <div class="orow"><span>🎲 주사위</span><div class="seg" id="segDice"></div></div>
    </div>
    <div class="panel"><h2>플레이어</h2><div id="players"></div></div>
    <div class="panel" style="display:flex;flex-direction:column;min-height:0;flex:1"><h2>진행 기록</h2><div class="log" id="log"></div></div>
  </aside>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true"></div>

<script>
'use strict';
/* ============ 기본 설정 (금액 단위: 만 원) ============ */
const SALARY = 20000;        // 월급 2억
const START_MONEY = 200000;  // 시작 자금 20억
const JAIL_FINE = 5000;      // 무인도 탈출 벌금 5천만
const MULT = [1,4,11,28,36,45];   // 집 0~4채, 5 = 랜드마크
const SAVE_KEY = 'paldobuja-save-v1';
const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, window.__FAST ? 0 : ms));
const rand = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

/* ============ 온라인 (Firebase Realtime Database, REST) ============ */
const FB_URL='https://paldobuja-default-rtdb.firebaseio.com';
const ROOT='paldobuja/rooms';
const net={online:false, role:null, room:null, clientId:null, mirror:null, unlisten:null, pending:{}, handled:{}, mySeat:-1,
  turnReq:null, waiting:null, debtSeat:null, lastEv:0, started:false, overShown:false, syncTimer:null, chain:Promise.resolve(), dirty:false, lastSent:'', lastGame:'', opsSeen:{}};
try{ net.clientId=localStorage.getItem('paldobuja-cid'); }catch(e){}
if(!net.clientId){ net.clientId='c'+Math.random().toString(36).slice(2,10)+Date.now().toString(36); try{ localStorage.setItem('paldobuja-cid',net.clientId); }catch(e){} }
let emitLock=0, manageRedraw=null;
const DBX = window.__MOCKDB || {
  async put(path,val){ const r=await fetch(`${FB_URL}/${path}.json`,{method:'PUT',body:JSON.stringify(val)}); if(!r.ok) throw new Error('db '+r.status); },
  async patch(path,val){ const r=await fetch(`${FB_URL}/${path}.json`,{method:'PATCH',body:JSON.stringify(val)}); if(!r.ok) throw new Error('db '+r.status); },
  async get(path){ const r=await fetch(`${FB_URL}/${path}.json`); if(!r.ok) throw new Error('db '+r.status); return r.json(); },
  async post(path,val){ const r=await fetch(`${FB_URL}/${path}.json`,{method:'POST',body:JSON.stringify(val)}); if(!r.ok) throw new Error('db '+r.status); return (await r.json()).name; },
  async del(path){ try{ await fetch(`${FB_URL}/${path}.json`,{method:'DELETE'}); }catch(e){} },
  listen(path, cb){
    const es=new EventSource(`${FB_URL}/${path}.json`);
    const h=e=>{ try{ const d=JSON.parse(e.data); if(d && 'path' in d) cb(e.type, d.path, d.data); }catch(_){} };
    es.addEventListener('put',h); es.addEventListener('patch',h);
    return ()=>es.close();
  }
};
function emit(k,d){
  if(net.role!=='host' || !state || emitLock) return;
  state.evn=(state.evn||0)+1; if(!Array.isArray(state.ev)) state.ev=[];
  state.ev.push(Object.assign({n:state.evn,k},d)); if(state.ev.length>40) state.ev.splice(0,state.ev.length-40);
  syncSoon();
}
function syncSoon(){ if(net.role!=='host' || !state || net.syncTimer) return; net.syncTimer=setTimeout(()=>{ net.syncTimer=null; syncNow(); },120); }
function syncNow(){
  if(net.role!=='host' || !state) return Promise.resolve();
  if(net.syncTimer){ clearTimeout(net.syncTimer); net.syncTimer=null; }
  net.dirty=true;
  net.chain=net.chain.then(async()=>{
    if(!net.dirty || !state) return; net.dirty=false;
    const g=JSON.stringify(Object.assign({},state,{log:state.log.slice(0,30)}));
    if(g===net.lastSent) return; net.lastSent=g;
    try{ await DBX.put(`${ROOT}/${net.room}/game`, g); }catch(e){ console.error(e); }
  });
  return net.chain;
}

let actx=null, gBgm=null, gSfx=null, bgmTimer=null, bgmStep=0, bgmNext=0, stepAlt=false;
function ensureAudio(){
  if(window.__FAST) return;
  try{
    if(!actx){ const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return; actx=new AC();
      gBgm=actx.createGain(); gSfx=actx.createGain(); gBgm.connect(actx.destination); gSfx.connect(actx.destination); applyVol(); }
    if(actx.state==='suspended') actx.resume();
    if(!bgmTimer) startBgm();
  }catch(e){}
}
function applyVol(){ if(!actx) return; gBgm.gain.value=Math.pow(prefs.bgm/100,2)*0.55; gSfx.gain.value=Math.pow(prefs.sfx/100,2)*0.9; }
const mtof=m=>440*Math.pow(2,(m-69)/12);
function tone(freq,t,dur,type,vol,dest,slideTo){
  const o=actx.createOscillator(), g=actx.createGain(); o.type=type; o.frequency.setValueAtTime(freq,t);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo,t+dur);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.012); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(dest); o.start(t); o.stop(t+dur+0.03);
}
// 오음계(도레미솔라)로 만든 귀여운 반복 배경음악
const MEL=[72,74,76,79,76,74,72,0, 74,76,79,81,79,0,76,0, 79,81,84,81,79,76,74,76, 72,0,0,0,69,72,74,0,
           76,76,79,76,74,72,74,0, 69,72,74,76,74,0,72,0, 79,76,81,79,76,74,72,74, 72,0,67,0,72,0,0,0];
const BASS=[48,41,45,43,48,45,41,48];
const EIGHTH=0.24;
function startBgm(){
  bgmNext=actx.currentTime+0.15; bgmStep=0;
  bgmTimer=setInterval(()=>{
    if(!actx || actx.state!=='running') return;
    while(bgmNext < actx.currentTime+0.3){
      const s=bgmStep%64, n=MEL[s];
      if(n){ tone(mtof(n),bgmNext,EIGHTH*0.85,'triangle',0.22,gBgm); tone(mtof(n+12),bgmNext,EIGHTH*0.4,'sine',0.04,gBgm); }
      if(s%2===0){ const root=BASS[Math.floor(s/8)]; const b=(s%8===0||s%8===4)?root:root+7; tone(mtof(b),bgmNext,EIGHTH*1.5,'square',0.045,gBgm); }
      if(s%4===2) tone(2600,bgmNext,0.025,'square',0.012,gBgm);
      bgmNext+=EIGHTH; bgmStep++;
    }
  },100);
}
document.addEventListener('visibilitychange',()=>{ if(!actx) return; if(document.hidden) actx.suspend(); else actx.resume(); });
function sfx(kind){
  emit('sfx',{s:kind});
  if(!actx || prefs.sfx===0) return; const t=actx.currentTime;
  try{
  switch(kind){
    case 'step': tone(stepAlt?880:740,t,0.07,'triangle',0.35,gSfx); stepAlt=!stepAlt; break;
    case 'tick': tone(1500,t,0.018,'square',0.04,gSfx); break;
    case 'stop': tone(240,t,0.12,'square',0.22,gSfx,120); tone(700,t,0.08,'triangle',0.2,gSfx); break;
    case 'in': tone(988,t,0.08,'square',0.16,gSfx); tone(1319,t+0.07,0.28,'square',0.16,gSfx); break;
    case 'out': tone(660,t,0.09,'triangle',0.3,gSfx); tone(440,t+0.08,0.09,'triangle',0.3,gSfx); tone(294,t+0.16,0.2,'triangle',0.3,gSfx); break;
    case 'card': [1047,1319,1568,2093].forEach((f,k)=>tone(f,t+k*0.05,0.14,'sine',0.22,gSfx)); break;
    case 'build': [392,523,659,784].forEach((f,k)=>tone(f,t+k*0.06,0.12,'square',0.12,gSfx)); break;
    case 'jail': tone(392,t,0.35,'sine',0.25,gSfx,196); break;
    case 'bankrupt': [392,370,349,330].forEach((f,k)=>tone(f,t+k*0.22,0.26,'triangle',0.3,gSfx)); break;
    case 'win': [523,659,784,1047,784,1047].forEach((f,k)=>tone(f,t+k*0.12,0.2,'square',0.15,gSfx)); break;
  }}catch(e){}
}
let koVoice=null;
function pickVoice(){ try{ const vs=speechSynthesis.getVoices(); koVoice=vs.find(v=>/^ko/i.test(v.lang)&&/female|yuna|sunhi|heami|여/i.test(v.name))||vs.find(v=>/^ko/i.test(v.lang))||null; }catch(e){} }
if(window.speechSynthesis){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }
function speak(text){
  emit('speak',{t:text});
  if(!prefs.voice || !window.speechSynthesis || window.__FAST) return;
  try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang='ko-KR'; if(koVoice) u.voice=koVoice;
    u.rate=1.05; u.pitch=1.15; u.volume=Math.max(0.3,prefs.sfx/100); speechSynthesis.speak(u); }catch(e){}
}

/* ============ 글자 도우미 ============ */
function lastCh(w){ return String(w).replace(/[)\]\s]+$/,'').slice(-1); }
function hasBatchim(w){ const c=lastCh(w).charCodeAt(0); if(c<0xAC00||c>0xD7A3) return false; return (c-0xAC00)%28!==0; }
function isRieul(w){ const c=lastCh(w).charCodeAt(0); return c>=0xAC00 && c<=0xD7A3 && (c-0xAC00)%28===8; }
function josa(w,t){
  const b=hasBatchim(w);
  switch(t){
    case '을': case '를': return w+(b?'을':'를');
    case '이': case '가': return w+(b?'이':'가');
    case '은': case '는': return w+(b?'은':'는');
    case '과': case '와': return w+(b?'과':'와');
    case '으로': case '로': return w+(b&&!isRieul(w)?'으로':'로');
    default: return w+t;
  }
}
function fill(line, v){ return line.replace(/\{(\w+)(?::([^}]+))?\}/g,(_,k,j)=>{ const val = v[k]!==undefined ? String(v[k]) : ''; return j?josa(val,j):val; }); }
function fmt(m){
  m=Math.round(m); const neg=m<0; m=Math.abs(m);
  const eok=Math.floor(m/10000), man=m%10000; let s='';
  if(eok) s+=eok.toLocaleString('ko-KR')+'억';
  if(man) s+=(s?' ':'')+man.toLocaleString('ko-KR')+'만';
  if(!s) s='0';
  return (neg?'-':'')+s+' 원';
}
function fmtShort(m){
  if(m>=10000){ const v=m/10000; return (Number.isInteger(v)?v:v.toFixed(1).replace(/\.0$/,''))+'억'; }
  if(m>=1000 && m%1000===0) return (m/1000)+'천만';
  return m.toLocaleString('ko-KR')+'만';
}
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let state = null;
let busy = false;
let timerId = null;
const cur = () => state.players[state.turn];
const alive = () => state.players.filter(p=>!p.bankrupt);
const playerById = id => state.players.find(p=>p.id===id);
const isOwnable = i => ['prop','station','utility'].includes(BOARD[i].type);
const priceOf = i => BOARD[i].price;

function ownsGroup(pid, g){ return BOARD.every((c,i)=> c.group!==g || (state.props[i] && state.props[i].owner===pid)); }
function groupIdx(g){ const r=[]; BOARD.forEach((c,i)=>{ if(c.group===g) r.push(i); }); return r; }
function countOwned(pid, type){ return BOARD.reduce((n,c,i)=> n + (c.type===type && state.props[i].owner===pid ? 1:0), 0); }
function ownedBy(pid){ const r=[]; BOARD.forEach((c,i)=>{ if(isOwnable(i) && state.props[i].owner===pid) r.push(i); }); return r; }
function rentOf(i, sum){
  const c=BOARD[i], st=state.props[i];
  if(st.owner==null || st.mortgaged) return 0;
  if(c.type==='prop'){ if(st.level===0) return ownsGroup(st.owner,c.group)? c.rent0*2 : c.rent0; return c.rent0*MULT[st.level]; }
  if(c.type==='station') return [0,2500,5000,10000,20000][countOwned(st.owner,'station')];
  if(c.type==='utility') return (sum||7) * (countOwned(st.owner,'utility')===2 ? 1200 : 500);
  return 0;
}
function netWorth(p){
  let w=p.money;
  ownedBy(p.id).forEach(i=>{ const st=state.props[i]; w += st.mortgaged ? priceOf(i)/2 : priceOf(i); if(BOARD[i].type==='prop') w += st.level*GROUPS[BOARD[i].group].house; });
  return w;
}
function liquidValue(p){
  let v=0;
  ownedBy(p.id).forEach(i=>{ const st=state.props[i]; if(BOARD[i].type==='prop') v+= st.level*GROUPS[BOARD[i].group].house/2; if(!st.mortgaged) v+=priceOf(i)/2; });
  return v;
}
function groupHasBuildings(g){ return groupIdx(g).some(i=>state.props[i].level>0); }
const freeBuild = () => !!state && state.settings.buildRule==='free';
function canBuild(p,i){
  const c=BOARD[i], st=state.props[i]; if(c.type!=='prop'||st.owner!==p.id||st.level>=5||st.mortgaged) return false;
  if(p.money < GROUPS[c.group].house) return false;
  const full=ownsGroup(p.id,c.group);
  if(freeBuild()) return full || p.pos===i;
  if(!full) return false;
  const gi=groupIdx(c.group); if(gi.some(j=>state.props[j].mortgaged)) return false;
  const min=Math.min(...gi.map(j=>state.props[j].level)); return st.level<=min;
}
function canSell(p,i){
  const c=BOARD[i], st=state.props[i]; if(c.type!=='prop'||st.owner!==p.id||st.level<=0) return false;
  if(freeBuild()) return true;
  const max=Math.max(...groupIdx(c.group).map(j=>state.props[j].level)); return st.level>=max;
}
function canMortgage(p,i){ const st=state.props[i]; if(st.owner!==p.id||st.mortgaged) return false; if(BOARD[i].type==='prop' && (freeBuild()? st.level>0 : groupHasBuildings(BOARD[i].group))) return false; return true; }
const unmortgageCost = i => Math.ceil(priceOf(i)*0.55/100)*100;
function canUnmortgage(p,i){ const st=state.props[i]; return st.owner===p.id && st.mortgaged && p.money>=unmortgageCost(i); }

function doBuild(p,i){ const h=GROUPS[BOARD[i].group].house; p.money-=h; state.props[i].level++; floatMoney(p,-h); sfx('build'); }
function doSell(p,i){ const h=GROUPS[BOARD[i].group].house/2; p.money+=h; state.props[i].level--; floatMoney(p,h); }
function doMortgage(p,i){ const v=priceOf(i)/2; p.money+=v; state.props[i].mortgaged=true; floatMoney(p,v); }
function doUnmortgage(p,i){ const v=unmortgageCost(i); p.money-=v; state.props[i].mortgaged=false; floatMoney(p,-v); }

async function goForwardTo(p, target){ // 앞으로 이동하며 출발을 지나면 월급
  const steps=(target - p.pos + N) % N; if(steps===0) return;
  await moveBy(p, steps, 70);
}
async function repairs(p, perHouse, perLand){
  let total=0; ownedBy(p.id).forEach(i=>{ const l=state.props[i].level; if(l===5) total+=perLand; else total+=l*perHouse; });
  if(total===0){ say('건물이 없어서 낼 돈이 없어요. 휴~'); return; }
  await payTo(p,total,'pot',`건물 비용 ${fmt(total)}`);
}
async function payEach(p, amt){
  for(const o of alive()){ if(o===p) continue; if(p.bankrupt) return; await payTo(p,amt,o,`${o.name}님에게 ${fmt(amt)}`); }
}
async function collectEach(p, amt){
  for(const o of alive()){ if(o===p) continue; await payTo(o,amt,p,`${p.name}님에게 ${fmt(amt)}`); }
}
const gain = (p,v) => { p.money+=v; floatMoney(p,v); };

/* ============ 화면: 보드 ============ */
function cellPos(i){
  if(i===0) return [13,13];
  if(i<12) return [13,13-i];
  if(i===12) return [13,1];
  if(i<24) return [13-(i-12),1];
  if(i===24) return [1,1];
  if(i<36) return [1,1+(i-24)];
  if(i===36) return [1,13];
  return [1+(i-36),13];
}
function sideOf(i){ if(i%12===0) return 'corner'; if(i<12) return 'b'; if(i<24) return 'l'; if(i<36) return 't'; return 'r'; }
function buildBoard(){
  const b=$('#board');
  b.querySelectorAll('.cell').forEach(e=>e.remove());
  BOARD.forEach((c,i)=>{
    const [r,col]=cellPos(i); const el=document.createElement('button');
    el.type='button'; el.className='cell '+sideOf(i)+(i%12===0?' corner':''); el.id='c'+i;
    el.style.gridRow=r; el.style.gridColumn=col;
    el.setAttribute('aria-label', c.name+' 정보 보기');
    const band = c.type==='prop' ? `<div class="band" style="background:${GROUPS[c.group].color}"></div>` : '';
    let pr='';
    if(c.price) pr=fmtShort(c.price);
    else if(c.type==='tax') pr=fmtShort(c.amount);
    else if(c.type==='start') pr='월급 2억';
    else if(c.type==='park') pr='<span class="potv"></span>';
    el.innerHTML = band + `<div class="body"><span class="ico">${c.emoji}</span><span class="nm">${esc(c.short)}</span>${pr?`<span class="pr">${pr}</span>`:''}</div><div class="own"></div>`;
    el.addEventListener('click',()=>{ if(!$('#modal').classList.contains('open')) showInfo(i); });
    b.insertBefore(el, $('#pieces'));
  });
  $('#toad').innerHTML=TOAD_SVG;
}
function renderBoard(){
  BOARD.forEach((c,i)=>{
    const el=$('#c'+i); if(!el) return;
    el.classList.toggle('here', !!state && cur() && cur().pos===i && !cur().bankrupt);
    if(!isOwnable(i)) return;
    const st=state.props[i]; const own=el.querySelector('.own');
    if(st.owner!=null){
      const o=playerById(st.owner); el.classList.add('owned'); el.style.setProperty('--oc',o.color);
      own.textContent = st.level===5 ? '🏙️' : '🏠'.repeat(st.level);
    } else { el.classList.remove('owned'); own.textContent=''; }
    el.classList.toggle('mort', !!st.mortgaged);
  });
  const pv=document.querySelector('#c24 .potv'); if(pv && state) pv.textContent = '기금 '+fmtShort(state.pot);
}
function unit(){ return $('#board').clientWidth / 14.2; }
function piecePos(p){
  const el=$('#c'+p.pos); const same=alive().filter(o=>o.pos===p.pos); const k=same.indexOf(p); const n=same.length;
  const u=unit(); const cols=n<=2?n:(n<=4?2:3); const rows=Math.ceil(n/cols);
  const cx=el.offsetLeft+el.offsetWidth/2, cy=el.offsetTop+el.offsetHeight/2+u*0.12;
  const sp=u*0.55; const col=k%cols, row=Math.floor(k/cols);
  return [cx+(col-(cols-1)/2)*sp, cy+(row-(rows-1)/2)*sp*1.05];
}
function renderPieces(){
  const layer=$('#pieces'); const u=unit();
  layer.style.setProperty('--ps', (u*0.78)+'px'); layer.style.setProperty('--tf', Math.max(9, u*0.27)+'px');
  state.players.forEach(p=>{
    let el=document.getElementById('pc'+p.id);
    if(p.bankrupt){ if(el) el.remove(); return; }
    if(!el){ el=document.createElement('div'); el.className='piece'; el.id='pc'+p.id; el.style.setProperty('--pc',p.color);
      el.innerHTML=`<div class="tag">${esc(p.name)}</div><div class="art">${animalSVG(p.animal)}</div>`; layer.appendChild(el); }
    const [x,y]=piecePos(p); el.style.left=x+'px'; el.style.top=y+'px';
    el.classList.toggle('cur', p===cur() && !state.over);
  });
}
function hop(p){ emit('hop',{p:p.id}); emitLock++; sfx('step'); emitLock--; const el=document.getElementById('pc'+p.id); if(!el) return; el.classList.remove('hop'); void el.offsetWidth; el.classList.add('hop'); }
function floatMoney(p, v){
  if(!state || p.bankrupt) return; emit('float',{p:p.id,v}); emitLock++; if(v) sfx(v>0?'in':'out'); emitLock--; const el=document.getElementById('pc'+p.id); if(!el) return;
  const f=document.createElement('div'); f.className='float '+(v>=0?'plus':'minus');
  f.textContent=(v>=0?'+':'−')+fmtShort(Math.abs(v)); f.style.left=el.style.left; f.style.top=(parseFloat(el.style.top)-unit()*0.6)+'px';
  $('#pieces').appendChild(f); setTimeout(()=>f.remove(),1400);
}

      <div class="pm">${fmt(p.money)}</div>${status?`<div class="st">${status}</div>`:''}<div class="chips">${chips}</div></div></div>`;

function renderMeta(){
  const s=state.settings; let lim='';
  if(s.mode==='rounds') lim=`${state.round} / ${s.limit}라운드`;
  else { lim=`${state.round}라운드`; }
  let time='';
  if(s.mode==='time'){ const left=Math.max(0, s.limit*60000 - elapsed()); const m=Math.floor(left/60000), sec=Math.floor(left%60000/1000); time=`<span>남은 시간 ${m}:${String(sec).padStart(2,'0')}</span>`; }
  $('#meta').innerHTML = `<span>${lim}</span>${time}<span>한강 기금 ${fmtShort(state.pot)}</span>`;
}
function renderTurnline(){
  const p=cur(); if(!p||state.over){ $('#turnline').innerHTML=''; return; }
  $('#turnline').innerHTML=`<span class="mini">${animalSVG(p.animal)}</span><span>${esc(p.name)}님 차례</span>`;

function renderControls(){
  const box=$('#controls'); const p=cur();
  if(state.over){ box.innerHTML=`<button class="btn" id="bAgain">새 게임 하기</button>`; $('#bAgain').onclick=()=>{ if(net.online) leaveRoom(); state=null; openSetup(); }; return; }
  if(rollCtl){ box.innerHTML=`<button class="btn" id="bStop">✋ ${rollCtl.stage===1?'첫 번째':'두 번째'} 주사위 멈추기</button>`; $('#bStop').onclick=()=>rollCtl&&rollCtl.stop(); $('#bStop').focus(); return; }
  if(net.role==='remote'){ renderRemoteControls(box); return; }
  if(net.waiting){ const wp=state.players[net.waiting.seat];
    box.innerHTML=`<span class="thinking">${esc(wp.name)}님이 자기 기기에서 고르는 중…</span><button class="btn small sec" id="bToCpu">CPU에게 맡기기</button>`;
    $('#bToCpu').onclick=()=>{ wp.isCPU=true; log(`${wp.name}님 자리를 CPU가 이어받았어요.`); const w=net.waiting; if(w && net.pending[w.id]){ const f=net.pending[w.id]; delete net.pending[w.id]; f(null); } renderAll(); };
    return; }
  if(p.isCPU){ box.innerHTML=`<span class="thinking">${esc(p.name)}님(CPU)이 생각 중이에요…</span>`; return; }
  if(isRemoteHuman(p)){ box.innerHTML=`<span class="thinking">${esc(p.name)}님 차례예요</span>`; return; }
  if(busy){ box.innerHTML=''; return; }
  let h='';
  if(state.phase==='roll'){
    h+=`<button class="btn" id="bRoll">🎲 주사위 굴리기</button>`;
    if(p.inJail){
      h+=`<button class="btn sec" id="bFine" ${p.money<JAIL_FINE?'disabled':''}>벌금 ${fmtShort(JAIL_FINE)} 내고 탈출</button>`;
      if(p.jailCards) h+=`<button class="btn sec" id="bCard">🚁 헬기 타고 탈출</button>`;
    }
  } else if(state.phase==='end'){
    h+=`<button class="btn" id="bEnd">턴 넘기기</button>`;
  }
  if(ownedBy(p.id).length) h+=`<button class="btn sec" id="bManage">🏗️ 자산 관리</button>`;
  box.innerHTML=h;
  const on=(id,fn)=>{ const e=document.getElementById(id); if(e) e.onclick=fn; };
  on('bRoll', ()=>guard(()=>doRoll(p)));
  on('bFine', ()=>guard(async()=>{ p.money-=JAIL_FINE; state.pot+=JAIL_FINE; floatMoney(p,-JAIL_FINE); p.inJail=false; p.jailTurns=0; say(pick(G.jailOut)); log(`${p.name}님이 벌금을 내고 무인도를 탈출했어요.`); }));
  on('bCard', ()=>guard(async()=>{ p.jailCards--; p.inJail=false; p.jailTurns=0; say(pick(G.jailOut)); log(`${p.name}님이 구조 헬기를 타고 탈출했어요.`); }));
  on('bEnd', ()=>{ if(!busy) endTurn(); });
  on('bManage', ()=>guard(()=>openManage(p,{debt:0})));
}
function renderAll(){ if(!state) return; renderBoard(); renderPieces(); renderPlayers(); renderMeta(); renderTurnline(); renderControls(); syncSoon(); }
async function guard(fn){ if(busy) return; busy=true; renderControls(); try{ await fn(); }catch(e){ console.error(e); } finally{ busy=false; renderAll(); } }

function say(text){ emit('say',{t:text}); const b=$('#bubble'); b.textContent=text; b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop'); }
function talk(dialect, kind, vars){ say(fill(pick(TALK[dialect][kind]), vars)); }

function renderLog(){ $('#log').innerHTML = state.log.map(t=>`<p>${esc(t)}</p>`).join(''); }

/* ============ 주사위 ============ */
const PIPS={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
function drawDie(el,n){ el.innerHTML=Array.from({length:9},(_,k)=>`<i class="${PIPS[n].includes(k)?'on':''}"></i>`).join(''); el.setAttribute('aria-label','주사위 '+n); }
let rollCtl=null;
function rollDiceHuman(){
  return new Promise(res=>{
    const e1=$('#d1'), e2=$('#d2'); const f=[rand(1,6),rand(1,6)]; let stage=1;
    e1.classList.remove('stopped'); e2.classList.remove('stopped'); $('#dice').classList.add('spin');
    const timer=setInterval(()=>{ if(stage<=1){ f[0]=f[0]%6+1; drawDie(e1,f[0]); } if(stage<=2){ f[1]=f[1]%6+1; drawDie(e2,f[1]); } sfx('tick'); }, prefs.dice);
    rollCtl={ get stage(){ return stage; }, stop(){
      if(stage===1){ stage=2; e1.classList.add('stopped'); sfx('stop'); renderControls(); }
      else if(stage===2){ stage=3; clearInterval(timer); e2.classList.add('stopped'); sfx('stop'); rollCtl=null; $('#dice').classList.remove('spin'); renderControls();
        setTimeout(()=>{ e1.classList.remove('stopped'); e2.classList.remove('stopped'); res([f[0],f[1]]); }, 300); }
    }};
    renderControls();
  });
}
async function rollDice(){
  const d1=rand(1,6), d2=rand(1,6); const e1=$('#d1'), e2=$('#d2');
  [e1,e2].forEach(e=>{ e.classList.remove('roll'); void e.offsetWidth; e.classList.add('roll'); });
  for(let k=0;k<5;k++){ drawDie(e1,rand(1,6)); drawDie(e2,rand(1,6)); sfx('tick'); await sleep(80); }
  sfx('stop');
  drawDie(e1,d1); drawDie(e2,d2); await sleep(250);
  return [d1,d2];
}

/* ============ 이동 ============ */
async function moveBy(p, steps, speed=170){
  for(let k=0;k<steps;k++){
    p.pos=(p.pos+1)%N;
    if(p.pos===0){ p.money+=SALARY; floatMoney(p,SALARY); say(fill(pick(G.salary),{name:p.name,amount:fmt(SALARY)})); log(`${p.name}님 월급 ${fmt(SALARY)}`); renderPlayers(); }
    renderPieces(); renderBoard(); hop(p); await sleep(speed);
  }
}
async function moveBack(p, steps){ for(let k=0;k<steps;k++){ p.pos=(p.pos-1+N)%N; renderPieces(); hop(p); await sleep(170); } }
async function sendToJail(p){
  p.pos=12; p.inJail=true; p.jailTurns=0; state.again=false; renderPieces(); hop(p); sfx('jail');
  say(pick(G.jail)); log(`${p.name}님이 무인도로 표류했어요.`); await sleep(700);
}

/* ============ 한 턴 ============ */
async function doRoll(p, preset){
  let d1, d2;
  if(Array.isArray(preset) && preset.length===2){ [d1,d2]=preset.map(x=>Math.min(6,Math.max(1,Math.round(+x)||1))); drawDie($('#d1'),d1); drawDie($('#d2'),d2); sfx('stop'); await sleep(250); }
  else [d1,d2] = p.isCPU ? await rollDice() : await rollDiceHuman();
  emit('dice',{a:d1,b:d2});
  const sum=d1+d2, dbl=d1===d2; state.lastSum=sum;
  log(`${p.name}님 주사위 ${d1} + ${d2} = ${sum}${dbl?' (더블)':''}`);
  state.again=false;
  if(p.inJail){
    if(dbl){ p.inJail=false; p.jailTurns=0; say(pick(G.jailOut)); await sleep(500); await moveBy(p,sum); await land(p,sum); }
    else {
      p.jailTurns++;
      if(p.jailTurns>=3){
        say('세 번째 실패! 벌금을 내고 나가야 해요.'); await sleep(600);
        const ok=await payTo(p,JAIL_FINE,'pot','무인도 벌금'); if(!ok){ afterAction(); return; }
        p.inJail=false; p.jailTurns=0; await moveBy(p,sum); await land(p,sum);
      } else { say(pick(G.jailStay)); }
    }
  } else {
    if(dbl){ state.doubles++; if(state.doubles>=3){ say(pick(G.speeding)); await sleep(700); await sendToJail(p); afterAction(); return; } }
    await moveBy(p,sum); await land(p,sum);
    state.again = dbl && !p.inJail && !p.bankrupt && !state.over;
    if(state.again){ await sleep(400); say(pick(G.double)); }
  }
  afterAction();
}
function afterAction(){ if(state.over) return; const p=cur(); state.phase = (state.again && !p.bankrupt) ? 'roll' : 'end'; renderAll(); }

async function land(p, sum){
  if(p.bankrupt || state.over) return;
  const i=p.pos, c=BOARD[i]; renderAll(); speak(arrivalText(c)); await sleep(250);
  switch(c.type){
    case 'prop': case 'station': case 'utility': {
      const st=state.props[i];
      if(st.owner==null){ await offerBuy(p,i); }
      else if(st.owner===p.id){ talk(dialectOf(i),'own',{place:c.name,name:p.name});
        if(freeBuild() && c.type==='prop' && !p.isCPU && canBuild(p,i)){ await sleep(400); applyBuildK(p,i, await askUser(p,'build',{i},()=>buildChoiceModal(p,i))); } }
      else if(st.mortgaged){ say(fill(pick(G.mortgaged),{place:c.name})); }
      else {
        const o=playerById(st.owner); const r=rentOf(i,sum);
        talk(dialectOf(i),'rent',{place:c.name,amount:fmt(r),owner:o.name,name:p.name});
        log(`${p.name}님 → ${o.name}님 통행료 ${fmt(r)} (${c.name})`);
        await sleep(500); const paid=await payTo(p,r,o,`${c.name} 통행료`);
        if(paid && state.settings.takeover && c.type==='prop' && st.level<5 && !o.bankrupt) await offerTakeover(p,i);
      }
      break;
    }
    case 'chance': case 'chest': await drawCard(p, c.type, sum); break;
    case 'tax':
      say(fill(pick(G.tax),{place:c.name,amount:fmt(c.amount)})); log(`${p.name}님 ${c.name} ${fmt(c.amount)}`);
      await sleep(400); await payTo(p,c.amount,'pot',c.name); break;
    case 'festival': {
      const f=pick(FESTIVALS); gain(p,f.v); say(`🎉 ${f.t} ${fmt(f.v)} 획득!`); log(`${p.name}님 지역 축제 보너스 ${fmt(f.v)}`); break;
    }
    case 'teleport': await doTeleport(p, sum); break;
    case 'park':
      if(state.pot>0){ const v=state.pot; state.pot=0; gain(p,v); say(fill(pick(G.park),{amount:fmt(v)})); log(`${p.name}님 한강 기금 ${fmt(v)} 획득`); }
      else say(pick(G.parkEmpty));
      break;
    case 'gotojail': await sendToJail(p); break;
    case 'jail': say(pick(G.visit)); break;
    case 'start': break;
  }
  renderAll();
}

async function buyProp(p,i,price){

  talk(dialectOf(i),'buy',{place:BOARD[i].name,name:p.name}); log(`${p.name}님이 ${josa(BOARD[i].name,'을')} ${fmt(price)}에 샀어요.`); renderAll();

function applyBuildK(p,i,k){

async function offerBuy(p,i){

function takeoverCost(i){ const c=BOARD[i], st=state.props[i]; return Math.round((c.price + st.level*GROUPS[c.group].house)*1.5/100)*100; }

async function drawCard(p, type, sum){
  const deckName = type==='chance'?'chance':'chest'; const src = type==='chance'?CHANCE:CHEST;
  if(!state.decks[deckName].length) state.decks[deckName]=shuffle(src.map((_,k)=>k));

async function doTeleport(p, sum){
  say(fill('지하철 순간이동! 요금 {amount} 내고 어디로 갈까요? 🚇',{amount:fmt(1000)}));

  let dest;
  if(p.isCPU){ await sleep(600); dest=cpuTeleport(p); }
  else { dest = await askUser(p,'teleport',{},()=>teleportModal(p)); if(dest!=null){ dest=Math.round(+dest); if(!(dest>=0 && dest<N) || dest===36) dest=null; } }
  if(dest==null || dest===p.pos) { say('그냥 여기 있을래요~'); return; }

/* ============ 돈 내기 / 파산 ============ */
async function payTo(p, amount, creditor, reason){
  if(p.bankrupt) return false;
  if(p.money < amount){
    const ok = await raiseFunds(p, amount, reason);
    if(!ok){ await goBankrupt(p, creditor); return false; }
  }
  p.money-=amount; floatMoney(p,-amount);
  if(creditor==='pot') state.pot+=amount;
  else if(creditor && typeof creditor==='object'){ creditor.money+=amount; floatMoney(creditor,amount); }
  renderAll(); return true;
}
async function raiseFunds(p, amount, reason){
  if(p.isCPU){ autoLiquidate(p, amount); return p.money>=amount; }
  while(p.money < amount){
    if(isRemoteHuman(p)){
      const hopeless = p.money + liquidValue(p) < amount;
      net.debtSeat=p.id; const v=await askUser(p,'debt',{amount,reason:reason||'',hopeless},null); net.debtSeat=null;
      if(p.isCPU){ autoLiquidate(p,amount); return p.money>=amount; }
      if(v==='bankrupt' || hopeless) return false;
      continue;
    }
    if(p.money + liquidValue(p) < amount){
      await infoModal('파산 위기', `<p>${esc(reason||'지불')} ${fmt(amount)}이 필요한데, 모든 건물을 팔고 땅을 저당 잡혀도 돈이 모자라요.</p>`, '파산 선언');
      return false;
    }
    const choice = await debtModal(p, amount, reason);
    if(choice==='bankrupt') return false;
    await openManage(p,{debt:amount});
  }
  return true;
}
function autoLiquidate(p, amount){
  let guardN=200;
  while(p.money<amount && guardN-->0){
    const sellable=ownedBy(p.id).filter(i=>canSell(p,i)).sort((a,b)=>state.props[b].level-state.props[a].level);
    if(sellable.length){ doSell(p,sellable[0]); continue; }
    const mort=ownedBy(p.id).filter(i=>canMortgage(p,i)).sort((a,b)=>{
      const ga = BOARD[a].type==='prop' && ownsGroup(p.id,BOARD[a].group) ? 1:0, gb = BOARD[b].type==='prop' && ownsGroup(p.id,BOARD[b].group) ? 1:0;
      return ga-gb || priceOf(a)-priceOf(b); });
    if(mort.length){ doMortgage(p,mort[0]); continue; }
    break;
  }
}
async function goBankrupt(p, creditor){
  p.bankrupt=true; p.inJail=false;
  ownedBy(p.id).forEach(i=>{ const st=state.props[i]; if(BOARD[i].type==='prop'){ p.money += st.level*GROUPS[BOARD[i].group].house/2; } st.level=0;
    if(creditor && typeof creditor==='object'){ st.owner=creditor.id; } else { st.owner=null; st.mortgaged=false; } });
  if(creditor && typeof creditor==='object'){ creditor.money+=Math.max(0,p.money); creditor.jailCards+=p.jailCards; }
  else if(creditor==='pot'){ state.pot+=Math.max(0,p.money); }
  p.money=0; p.jailCards=0;
  say(fill(pick(G.bankrupt),{name:p.name})); log(`💥 ${p.name}님 파산!`); sfx('bankrupt');
  state.again=false; renderAll(); await sleep(1200);
  if(alive().length<=1) await gameOver('last');
}

/* ============ 턴 넘기기 / 종료 ============ */
function elapsed(){ return state.elapsedBase + (Date.now()-state.sessionStart); }
async function startTurn(){
  if(state.over) return;
  const p=cur();
  if(p.bankrupt){ endTurn(); return; }
  state.phase='roll'; state.doubles=0; state.again=false; renderAll(); if(!net.online) saveGame();
  say(fill(pick(p.isCPU?G.cpuTurn:G.turn),{name:p.name}));
  if(p.isCPU){ await sleep(800); await cpuTurn(p); }
  else if(isRemoteHuman(p)){ await remoteTurn(p); }
}
function endTurn(){
  if(state.over) return;
  const n=state.players.length; let i=state.turn, wrapped=false, guardN=0;
  do{ i=(i+1)%n; if(i===0) wrapped=true; guardN++; } while(state.players[i].bankrupt && guardN<=n);
  if(wrapped || i<=state.turn) state.round++;
  state.turn=i;
  const s=state.settings;
  if(s.mode==='rounds' && state.round> s.limit){ gameOver('limit'); return; }
  if(s.mode==='time' && elapsed() >= s.limit*60000){ gameOver('limit'); return; }
  startTurn();
}
async function gameOver(reason){
  if(state.over) return;
  state.over=true; clearSave(); renderAll();
  const ranking=state.players.slice().sort((a,b)=> (a.bankrupt-b.bankrupt) || netWorth(b)-netWorth(a));
  const w=ranking[0];
  state.overReason=reason;
  sfx('win'); speak(`${w.name}님 우승!`);
  say(`🎊 ${w.name}님이 팔도부자에 등극했어요! 금두꺼비가 엽전 한 닢 드려요~`);
  log(`🏆 ${w.name}님 우승!`);
  await syncNow();
  await showGameOver();
}
async function showGameOver(){
  const reason=state.overReason;
  const ranking=state.players.slice().sort((a,b)=> (a.bankrupt-b.bankrupt) || netWorth(b)-netWorth(a));
  const w=ranking[0];
  const rows=ranking.map((p,k)=>`<tr><td>${k+1}위 ${esc(p.name)} (${ANIMALS[p.animal]})</td><td>${p.bankrupt?'파산':fmt(netWorth(p))}</td></tr>`).join('');
  await infoModal('게임 끝!', `<p>${reason==='limit'?'정해진 시간이 끝났어요. 총자산(현금 + 땅 + 건물)으로 순위를 매겨요.':'마지막까지 살아남은 부자가 나왔어요!'}</p>
    <div style="display:flex;align-items:center;gap:12px;margin:8px 0 12px"><div style="width:64px">${animalSVG(w.animal)}</div><div class="pricebig">${esc(w.name)}님 우승!</div></div>
    <table class="rents">${rows}</table>`, '확인', w.color);
  renderAll();
}

/* ============ CPU ============ */
function cpuWantsBuy(p,i,price){
  const c=BOARD[i]; let reserve=30000;
  if(c.type==='prop'){
    const gi=groupIdx(c.group); const mine=gi.filter(j=>state.props[j].owner===p.id).length; const others=gi.filter(j=>state.props[j].owner!=null && state.props[j].owner!==p.id).length;
    if(mine===gi.length-1) reserve=8000;
    else if(others>0 && mine===0) reserve=45000;
  }
  if(state.round<=3) reserve=Math.min(reserve,15000);
  return p.money - price >= reserve;
}
function cpuManage(p){
  let changed=false;
  ownedBy(p.id).filter(i=>state.props[i].mortgaged).sort((a,b)=>priceOf(b)-priceOf(a)).forEach(i=>{ if(p.money-unmortgageCost(i) > 60000){ doUnmortgage(p,i); changed=true; } });
  for(let loop=0;loop<30;loop++){
    const opts=ownedBy(p.id).filter(i=>canBuild(p,i) && p.money-GROUPS[BOARD[i].group].house > 35000).sort((a,b)=>state.props[a].level-state.props[b].level || priceOf(b)-priceOf(a));
    if(!opts.length) break;
    doBuild(p,opts[0]); changed=true;
    log(`${p.name}님이 ${josa(BOARD[opts[0]].name,'에')} 건물을 올렸어요.`);
    talk(dialectOf(opts[0]),'build',{place:BOARD[opts[0]].name,name:p.name});
  }
  if(changed) renderAll();
  return changed;
}
function cpuTeleport(p){
  const cands=BOARD.map((c,i)=>i).filter(i=>isOwnable(i) && state.props[i].owner==null && priceOf(i) <= p.money-15000);
  if(cands.length){ cands.sort((a,b)=>priceOf(b)-priceOf(a)); return cands[0]; }
  if(state.pot>=5000) return 24;
  return 24;
}
async function cpuTurn(p){
  try{
    while(!state.over && cur()===p && !p.bankrupt && state.phase==='roll'){
      if(cpuManage(p)) await sleep(500);
      if(p.inJail){
        const unowned=BOARD.filter((c,i)=>isOwnable(i)&&state.props[i].owner==null).length;
        if(p.jailCards>0){ p.jailCards--; p.inJail=false; p.jailTurns=0; say(pick(G.jailOut)); log(`${p.name}님이 구조 헬기를 타고 탈출했어요.`); await sleep(600); }
        else if(unowned>8 && p.money>JAIL_FINE+40000){ p.money-=JAIL_FINE; state.pot+=JAIL_FINE; floatMoney(p,-JAIL_FINE); p.inJail=false; p.jailTurns=0; say(pick(G.jailOut)); log(`${p.name}님이 벌금을 내고 무인도를 탈출했어요.`); await sleep(600); }
      }
      await sleep(400);
      await doRoll(p);
      if(state.over || p.bankrupt || !state.again) break;
      await sleep(700);
    }
    if(!state.over && !p.bankrupt){ if(cpuManage(p)) await sleep(500); }
  }catch(e){ console.error(e); }
  if(state.over) return;
  await sleep(800); endTurn();
}

/* ============ 모달 ============ */
let modalResolve=null;
function openModal(build){

function closeModal(v){ manageRedraw=null; const m=$('#modal'); m.classList.remove('open'); m.innerHTML=''; const r=modalResolve; modalResolve=null; if(r) r(v); }
function head(c){
  const color = c.type==='prop'?GROUPS[c.group].color:'#3d5550';
  const grp = c.type==='prop'?GROUPS[c.group].name:({station:'교통',utility:'공공기관',chance:'카드',chest:'카드',tax:'세금'}[c.type]||'특별 칸');

function quizBlock(sheet, c, onDone){
  const opts=shuffle(c.quiz.opts.map((t,k)=>({t,right:k===0})));
  const wrap=document.createElement('div');
  wrap.innerHTML=`<h4>🎓 퀴즈</h4><p>${esc(c.quiz.q)}</p><div class="quiz-opts">${opts.map((o,k)=>`<button type="button" data-k="${k}">${esc(o.t)}</button>`).join('')}</div><p class="note qres" style="margin-top:8px"></p>`;
  wrap.querySelectorAll('.quiz-opts button').forEach(b=>b.onclick=()=>{
    const k=+b.dataset.k; const right=opts[k].right;
    wrap.querySelectorAll('.quiz-opts button').forEach((x,j)=>{ x.disabled=true; if(opts[j].right) x.classList.add('right'); });
    if(!right) b.classList.add('wrong');
    wrap.querySelector('.qres').textContent = right ? '정답이에요! 👏' : `아쉬워요. 정답은 "${c.quiz.opts[0]}"예요.`;
    onDone && onDone(right);
  });
  return wrap;
}

function buyModal(p,i){
  const c=BOARD[i]; let price=c.price, quizUsed=false;
  return openModal(sheet=>{
    function draw(view){
      const afford=p.money>=price;
      let body='';
      if(view==='main'){
        body = `<div class="pricebig">${price<c.price?`<s>${fmt(c.price)}</s>`:''}${fmt(price)}</div>
          <p class="note">보유 현금 ${fmt(p.money)}${afford?'':' · 돈이 모자라요'}</p>
          ${c.type==='prop'?`<p>${esc(c.info.m)}</p>`:`<p>${esc(c.desc)}</p>`}
          <h4>💰 통행료</h4>${rentTable(i)}`;
      } else if(view==='info'){ body = infoHTML(c); }
      sheet.innerHTML = head(c) + `<div class="inner">${body}</div>`;
      const inner=sheet.querySelector('.inner');
      if(view==='quiz'){
        inner.innerHTML=`<p class="note">맞히면 땅값을 10% 깎아 드려요!</p>`;
        inner.appendChild(quizBlock(sheet,c,right=>{ quizUsed=true; if(right){ price=Math.round(c.price*0.9/100)*100; say('정답! 금두꺼비가 10% 깎아 드릴게요~ 🐸'); } else say('땡! 그래도 공부는 남는 거예요~'); }));
      }
      const a=document.createElement('div'); a.className='actions';
      if(view==='main'){
        a.innerHTML = `${c.type==='prop'?'<button class="btn sec" data-v="info">📖 지역 정보</button>':''}${c.type==='prop'&&!quizUsed?'<button class="btn sec" data-v="quiz">🎓 퀴즈 풀고 10% 할인</button>':''}
          <button class="btn" data-v="buy" ${afford?'':'disabled'}>${fmtShort(price)}에 사기</button><button class="btn sec" data-v="pass">안 살래요</button>`;
      } else a.innerHTML = `<button class="btn" data-v="main">돌아가기</button>`;
      a.querySelectorAll('button').forEach(b=>b.onclick=()=>{ const v=b.dataset.v;
        if(v==='buy') closeModal({buy:true,price}); else if(v==='pass') closeModal({buy:false}); else draw(v); });
      sheet.appendChild(a);
      const f=a.querySelector('button:not([disabled])'); if(f) f.focus();
    }
    draw('main');
  });
}

function openManage(p, {debt}){
  return openModal(sheet=>{
    function draw(){
      const list=ownedBy(p.id);
      const rows=list.map(i=>{
        const c=BOARD[i], st=state.props[i];
        const col=c.type==='prop'?GROUPS[c.group].color:'#777';
        const lvl = c.type==='prop' ? (st.level===5?'랜드마크':(st.level?`집 ${st.level}채`:'땅만')) : (c.type==='station'?'교통':'공공기관');
        const h = c.type==='prop' ? GROUPS[c.group].house : 0;
        let btns='';
        if(c.type==='prop' && !debt) btns+=`<button class="btn small" data-a="build" data-i="${i}" ${canBuild(p,i)?'':'disabled'} title="건물 올리기 ${fmt(h)}">＋ ${fmtShort(h)}</button>`;
        if(c.type==='prop') btns+=`<button class="btn small sec" data-a="sell" data-i="${i}" ${canSell(p,i)?'':'disabled'} title="건물 팔기 ${fmt(h/2)}">－ 팔기</button>`;
        if(st.mortgaged) btns+=`<button class="btn small sec" data-a="unmort" data-i="${i}" ${canUnmortgage(p,i)&&!debt?'':'disabled'}>해제 ${fmtShort(unmortgageCost(i))}</button>`;
        else btns+=`<button class="btn small sec" data-a="mort" data-i="${i}" ${canMortgage(p,i)?'':'disabled'}>저당 +${fmtShort(priceOf(i)/2)}</button>`;
        return `<div class="mrow"><span class="sw" style="background:${col}"></span><div class="mn">${esc(c.name)}<small>${lvl}${st.mortgaged?' · 저당 중':''}${c.type!=='prop'||st.mortgaged?'':' · 통행료 '+fmtShort(rentOf(i))}</small></div><div class="mb">${btns}</div></div>`;
      }).join('') || '<p class="note">가진 땅이 없어요.</p>';
      sheet.innerHTML = `<div class="head" style="background:${p.color}"><div class="grp">${debt?'필요한 돈 '+fmt(debt):'같은 색 땅을 모두 가지면 건물을 올릴 수 있어요'}</div><h3>🏗️ ${esc(p.name)}님 자산 관리</h3></div>
        <div class="inner"><p class="pricebig">현금 ${fmt(p.money)}</p><p class="note">건물은 같은 색 땅에 고르게 올려야 해요. 집 4채 다음은 랜드마크! 건물은 절반 값에 팔려요.</p>${rows}</div>
        <div class="actions"><button class="btn" data-a="close">${debt?(p.money>=debt?'지불하러 가기':'닫기'):'닫기'}</button></div>`;
      sheet.querySelectorAll('button[data-a]').forEach(b=>b.onclick=()=>{
        const a=b.dataset.a, i=+b.dataset.i;
        if(a==='close'){ manageRedraw=null; return closeModal(); }
        if(net.role==='remote'){ sendOp(a,i); b.disabled=true; return; }
        applyOp(p,a,i); renderAll(); draw();
      });
    }
    manageRedraw=()=>{ const me = net.role==='remote' ? state.players[net.mySeat] : p; if(me) p=me; draw(); };
    draw();
  });
}
function applyOp(p,a,i){
  if(!isOwnable(i)) return false;
  if(a==='build' && canBuild(p,i)){ doBuild(p,i); talk(dialectOf(i),'build',{place:BOARD[i].name,name:p.name}); log(`${p.name}님이 ${josa(BOARD[i].name,'에')} 건물을 올렸어요.`); return true; }
  if(a==='sell' && canSell(p,i)){ doSell(p,i); log(`${p.name}님이 ${BOARD[i].name} 건물을 팔았어요.`); return true; }
  if(a==='mort' && canMortgage(p,i)){ doMortgage(p,i); log(`${p.name}님이 ${josa(BOARD[i].name,'을')} 저당 잡혔어요.`); return true; }
  if(a==='unmort' && canUnmortgage(p,i)){ doUnmortgage(p,i); log(`${p.name}님이 ${BOARD[i].name} 저당을 풀었어요.`); return true; }
  return false;
}

const RULES_HTML = `<p>전국 팔도의 땅을 사고, 건물을 올리고, 통행료를 받아 최고 부자가 되는 게임이에요.</p>
<h4>🎲 기본</h4><p>주사위 두 개를 굴려(멈추는 타이밍은 내가 정해요!) 나온 만큼 이동해요. 더블이 나오면 한 번 더! 더블 세 번은 과속이라 무인도로 가요. 출발을 지나면 월급 2억 원을 받아요.</p>
<h4>🏠 땅과 건물</h4><p>빈 땅에 도착하면 살 수 있어요. 퀴즈를 맞히면 10% 할인! 같은 색 땅을 모두 가지면 통행료가 두 배가 되고, 집(최대 4채)과 랜드마크를 올릴 수 있어요. 건물은 같은 색 땅에 고르게 올려야 해요.</p>
<h4>🏗️ 건물 짓기 규칙</h4><p>"땅 살 때 바로 짓기"를 고르면, 땅을 사는 순간이나 내 땅에 다시 도착했을 때 집과 랜드마크를 올릴 수 있어요. "같은 색 모두 모아야 짓기"는 원래 모노폴리 방식이에요.</p>
<h4>🎲 타이밍 주사위</h4><p>"주사위 굴리기"를 누르면 두 주사위가 1부터 6까지 빠르게 돌아가요. 한 번 누르면 첫 번째가, 한 번 더 누르면 두 번째가 멈춰요. 주사위를 직접 누르거나 스페이스바를 눌러도 돼요.</p>

<h4>🌉 한강공원 쉼터</h4><p>세금, 벌금, 순간이동 요금은 "한강 기금"에 쌓이고, 쉼터에 도착한 사람이 몽땅 가져가요.</p>

async function askUser(p, kind, payload, localFn){
  if(!isRemoteHuman(p)) return localFn ? await localFn() : null;

  const id='q'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  const pr=new Promise(res=>{ net.pending[id]=res; });
  net.waiting={id, seat:p.id}; renderControls();
  try{ await DBX.put(rpath('req'), {id, seat:p.id, kind, payload:JSON.stringify(payload||{})}); }catch(e){ console.error(e); }
  const v=await pr; if(net.waiting && net.waiting.id===id) net.waiting=null; renderControls();
  return v;
}
async function remoteTurn(p){
  while(!state.over && cur()===p && !p.bankrupt){
    const v=await askUser(p,'turn',{phase:state.phase},null);
    if(p.isCPU || !v){ await cpuTurn(p); return; }
    if(v.a==='fine' && p.inJail && state.phase==='roll' && p.money>=JAIL_FINE){ p.money-=JAIL_FINE; state.pot+=JAIL_FINE; floatMoney(p,-JAIL_FINE); p.inJail=false; p.jailTurns=0; say(pick(G.jailOut)); log(`${p.name}님이 벌금을 내고 무인도를 탈출했어요.`); renderAll(); }
    else if(v.a==='card' && p.inJail && state.phase==='roll' && p.jailCards>0){ p.jailCards--; p.inJail=false; p.jailTurns=0; say(pick(G.jailOut)); log(`${p.name}님이 구조 헬기를 타고 탈출했어요.`); renderAll(); }
    else if(v.a==='roll' && state.phase==='roll'){ await doRoll(p, v.d); }
    else if(v.a==='end' && state.phase==='end'){ endTurn(); return; }
  }
}
function applyRemoteOp(o){
  if(!state || !o) return; const p=state.players[o.seat]; const i=+o.i;
  if(!p || p.bankrupt || p.isCPU || state.over) return;
  if(!(state.turn===p.id || net.debtSeat===p.id)) return;
  if(o.a==='build' && net.debtSeat===p.id) return;

}
function answer(id, v){ DBX.put(rpath('res/'+id), JSON.stringify(v===undefined?null:v)).catch(e=>console.error(e)); }
function sendOp(a,i){ DBX.post(rpath('ops'), {seat:net.mySeat, a, i}).catch(e=>console.error(e)); }
async function handleReq(rq){
  let pl={}; try{ pl=JSON.parse(rq.payload||'{}'); }catch(e){}
  const me=state && state.players[net.mySeat]; if(!me) return;
  let v=null;
  try{
    switch(rq.kind){
      case 'turn': net.turnReq={id:rq.id, phase:pl.phase}; renderControls(); if(prefs.voice) speak(`${me.name}님 차례예요!`); return;
      case 'buy': v=await buyModal(me, pl.i); break;
      case 'build': v=await buildChoiceModal(me, pl.i); break;
      case 'takeover': v=await takeoverModal(me, pl.i, pl.cost, state.players[pl.owner]); break;
      case 'teleport': v=await teleportModal(me); break;
      case 'card': await cardModal(pl.title, pl.text, pl.type); v=1; break;
      case 'debt':
        if(pl.hopeless){ await infoModal('파산 위기', `<p>${esc(pl.reason||'지불')} ${fmt(pl.amount)}이 필요한데, 모든 건물을 팔고 땅을 저당 잡혀도 돈이 모자라요.</p>`, '파산 선언'); v='bankrupt'; }

function setPath(root, path, val){
  const parts=String(path).split('/').filter(Boolean);
  if(!parts.length) return val;
  if(!root || typeof root!=='object') root={};
  let o=root; for(let k=0;k<parts.length-1;k++){ if(!o[parts[k]] || typeof o[parts[k]]!=='object') o[parts[k]]={}; o=o[parts[k]]; }
  const last=parts[parts.length-1]; if(val===null) delete o[last]; else o[last]=val;
  return root;
}
function onRoomEvent(type, path, data){
  if(type==='put') net.mirror=setPath(net.mirror, path, data);
  else if(data && typeof data==='object'){ for(const k in data) net.mirror=setPath(net.mirror, (path==='/'?'':path)+'/'+k, data[k]); }
  try{ onRoomChange(); }catch(e){ console.error(e); }
}
function onRoomChange(){
  if(!net.room) return;
  const m=net.mirror||{}; const meta=m.meta;
  if(!meta){ if(!net.started) renderLobby(); return; }
  if(meta.status==='lobby'){ if(!net.started) renderLobby(); return; }
  if(net.role==='host'){
    if(!net.started && m.game){
      net.started=true; state=JSON.parse(m.game); state.sessionStart=Date.now(); busy=false;
      $('#setup').classList.add('hide'); beginUI(); log('🔌 방장이 다시 연결됐어요.'); if(!state.over) startTurn();
    }
    if(m.res) for(const id in m.res){ const f=net.pending[id]; DBX.del(rpath('res/'+id)); if(f){ delete net.pending[id]; let v=null; try{ v=JSON.parse(m.res[id]); }catch(e){} f(v); } }
    if(m.ops) for(const k in m.ops){ if(net.opsSeen[k]) continue; net.opsSeen[k]=1; const o=m.ops[k]; DBX.del(rpath('ops/'+k)); applyRemoteOp(o); }
  } else {
    if(m.game && m.game!==net.lastGame){ net.lastGame=m.game; try{ applyRemoteGame(JSON.parse(m.game)); }catch(e){ console.error(e); } }
    const rq=m.req; if(rq && rq.seat===net.mySeat && !net.handled[rq.id] && state){ net.handled[rq.id]=1; handleReq(rq); }
  }
}
function applyRemoteGame(g){
  state=g;
  if(!net.started){
    net.started=true; net.mySeat=g.players.findIndex(p=>p.client===net.clientId);
    $('#setup').classList.add('hide'); beginUI(); net.lastEv=g.evn||0;
    say(net.mySeat>=0 ? `${g.players[net.mySeat].name}님, 게임에 들어왔어요! 자기 차례에 버튼이 나타나요 🐸` : '구경꾼으로 들어왔어요.');
  } else {
    renderAll();
    (g.ev||[]).filter(e=>e.n>net.lastEv).forEach(replayEv);
    net.lastEv=Math.max(net.lastEv, g.evn||0);
  }
  renderAll(); renderLog(); if(manageRedraw) manageRedraw();
  if(g.over && !net.overShown){ net.overShown=true; showGameOver(); }
}
function replayEv(e){
  try{

      case 'sfx': sfx(e.s); break;
      case 'speak': speak(e.t); break;
      case 'hop': { const p=state.players[e.p]; if(p) hop(p); break; }

    <label class="lbl">건물 짓기 규칙</label>${seg('buildRule',[['free','땅 살 때 바로 짓기'],['set','같은 색 모두 모아야 짓기']])}
    <label class="lbl">땅 인수 규칙</label>${seg('takeover',[['true','켜기'],['false','끄기']])}
    <p class="note" style="margin-top:12px">${isHost?'방장 기기는 게임이 끝날 때까지 켜 두세요. 게임 진행은 방장 기기가 맡아요.':'방장이 시작하기를 기다리고 있어요…'}</p>
    <div class="startrow"><button class="btn sec" id="lLeave">나가기</button>${isHost?`<button class="btn" id="lStart" ${total<2?'disabled':''}>게임 시작</button>`:''}</div>
  </div>`;
  $('#lCopy').onclick=async()=>{ const link=shareLink(net.room); try{ await navigator.clipboard.writeText(link); $('#lCopy').textContent='✅ 복사했어요!'; }catch(e){ window.prompt('이 링크를 복사해서 보내 주세요', link); } };
  $('#lLeave').onclick=()=>{ leaveRoom(); openSetup(); };
  el.querySelectorAll('[data-myanimal]').forEach(b=>b.onclick=()=>DBX.patch(rpath('seats/'+net.clientId),{animal:b.dataset.myanimal}));
  if(isHost){
    const add=$('#lAddCpu'); if(add) add.onclick=()=>{ const a=ANIMAL_ORDER.find(x=>!used.includes(x)); if(!a) return; cpus.push({name:ANIMALS[a], animal:a}); DBX.patch(rpath('meta'),{cpus:JSON.stringify(cpus)}); };
    el.querySelectorAll('[data-rmcpu]').forEach(b=>b.onclick=()=>{ cpus.splice(+b.dataset.rmcpu,1); DBX.patch(rpath('meta'),{cpus:JSON.stringify(cpus)}); });
    el.querySelectorAll('[data-set]').forEach(b=>b.onclick=()=>{ const [k,v]=b.dataset.set.split(/:(.*)/s); const val = v==='true'?true: v==='false'?false: v; DBX.patch(rpath('meta/settings'),{[k]:val}); });
    $('#lStart').onclick=()=>hostStart();
  }
}
async function hostStart(){
  const m=net.mirror||{}; const meta=m.meta; if(!meta) return;
  const seats=Object.entries(m.seats||{}).map(([cid,x])=>Object.assign({cid},x)).sort((a,b)=>a.t-b.t);
  const cpus=JSON.parse(meta.cpus||'[]'); const st=meta.settings||{};
  const list=[...seats.map(x=>({name:x.name, animal:x.animal, isCPU:false, client:x.cid})), ...cpus.map(c=>({name:c.name, animal:c.animal, isCPU:true}))].slice(0,6);
  if(list.length<2) return;
  const seen=new Set(); list.forEach(p=>{ if(seen.has(p.animal)) p.animal=ANIMAL_ORDER.find(a=>!seen.has(a) && !list.some(q=>q!==p && q.animal===a)); seen.add(p.animal); });
  ensureAudio(); clearSave();
  net.started=true;
  state=newState({count:list.length, mode:st.mode||'rounds:25', takeover:st.takeover!==false, buildRule:st.buildRule||'free', players:list}); busy=false;
  await syncNow();
  try{ await DBX.patch(rpath('meta'),{status:'playing'}); }catch(e){ console.error(e); }
  beginUI(); log('🎲 팔도부자 온라인 게임 시작!'); say('어서 오세요! 팔도부자 은행장 금두꺼비예요. 다들 부자 되세요~ 🐸');
  setTimeout(()=>startTurn(), window.__FAST?0:900);
}

/* ============ 시작 ============ */
buildBoard();
$('#btnRules').onclick=()=>{ if(!$('#modal').classList.contains('open')) infoModal('팔도부자 규칙', RULES_HTML); };
$('#btnNew').onclick=()=>{ if($('#modal').classList.contains('open')) return;
  openModal(sheet=>{ sheet.innerHTML=`<div class="head" style="background:#3d5550"><h3>새 게임을 시작할까요?</h3></div><div class="inner"><p>지금 게임은 사라져요.</p></div><div class="actions"><button class="btn red" data-v="1">새 게임</button><button class="btn sec" data-v="0">계속하기</button></div>`;
    sheet.querySelectorAll('button').forEach(b=>b.onclick=()=>closeModal(b.dataset.v==='1')); })
  .then(ok=>{ if(ok){ if(net.online) leaveRoom(); if(state && net.role!=='remote') state.over=true; clearSave(); state=null; openSetup(); } });
};
window.addEventListener('resize',()=>{ if(state) renderPieces(); });
document.addEventListener('pointerdown',()=>ensureAudio(),{once:true});
$('#dice').addEventListener('click',()=>{ if(rollCtl) rollCtl.stop(); else { const b=document.getElementById('bRoll'); if(b) b.click(); } });
document.addEventListener('keydown',e=>{
  if($('#modal').classList.contains('open') || !$('#setup').classList.contains('hide')) return;
  if(e.code==='Space' && (rollCtl || document.getElementById('bRoll'))){ e.preventDefault(); if(rollCtl) rollCtl.stop(); else document.getElementById('bRoll').click(); }
});
function initOpts(){
  const vb=$('#volBgm'), vs=$('#volSfx'); vb.value=prefs.bgm; vs.value=prefs.sfx;
  vb.oninput=()=>{ prefs.bgm=+vb.value; applyVol(); savePrefs(); ensureAudio(); };
  vs.oninput=()=>{ prefs.sfx=+vs.value; applyVol(); savePrefs(); };
  vs.onchange=()=>sfx('in');
  const seg=(id,items,key)=>{ const el=$(id); const draw=()=>{ el.innerHTML=items.map(([v,l])=>`<button type="button" class="chipbtn ${prefs[key]===v?'on':''}" data-v="${v}">${l}</button>`).join('');
    el.querySelectorAll('button').forEach(b=>b.onclick=()=>{ const raw=b.dataset.v; prefs[key]= raw==='true'?true: raw==='false'?false: +raw; savePrefs(); draw(); applyFs(); if(key==='voice'&&prefs.voice) speak('음성 안내를 켰어요.'); if(key==='voice'&&!prefs.voice&&window.speechSynthesis) speechSynthesis.cancel(); }); }; draw(); };
  seg('#segVoice',[[true,'켜기'],[false,'끄기']],'voice');
  seg('#segFs',[[1,'보통'],[2,'크게'],[3,'아주 크게']],'fs');
  seg('#segDice',[[150,'느리게'],[110,'보통'],[75,'빠르게']],'dice');
  applyFs();
}
function applyFs(){ const b=$('#board'); b.classList.remove('fs1','fs2','fs3'); b.classList.add('fs'+prefs.fs); if(state) renderPieces(); }
initOpts();
window.__game = { get state(){ return state; }, startGame, setupCfg };
openSetup();
</script>
